name: Hold A1 Family Media 1.7 pending design approval

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  hold-pending-release:
    runs-on: ubuntu-latest
    steps:
      - name: Keep 1.7 private and restore 1.6 as the public latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.7 --repo "${GITHUB_REPOSITORY}" --draft --prerelease
          gh release edit v1.6 --repo "${GITHUB_REPOSITORY}" --latest
          echo "A1 Family Media 1.7 is held as a draft. Version 1.6 remains the public latest release."
