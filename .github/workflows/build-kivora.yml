name: Build Kivora Music Player

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - safety/a1-family-stage-1
      - feature/a1-family-media-upgrade
      - feature/ui-video-space-polish
      - fix/open-audio-from-files
      - ui/remove-duplicate-search-tab
      - feature/ad-free-library-polish
      - chore/reliability-readme-diff-check
      - chore/clarify-legacy-playback-recovery
      - ci/protect-media-integration-and-ad-free-v2
      - ci/enforce-release-identity-match
      - ci/guard-file-open-and-video-permission
      - test/media-file-classification
      - perf/background-video-library-scan
      - perf/background-music-library-scan
      - fix/preserve-library-on-scan-error
      - fix/non-null-music-scan-errors
      - fix/preserve-video-library-on-scan-error
      - perf/background-video-thumbnails
      - perf/cache-video-thumbnails

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-list --count HEAD)" -gt 1 ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Verify media integration and ad-free safeguards
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"
          GRADLE_FILE="app/build.gradle.kts"
          test -s "$MANIFEST"
          test -s "$GRADLE_FILE"
          grep -Fq 'android:label="A1 FAMILY MEDIA"' "$MANIFEST"
          grep -Fq 'android:name=".KivoraPlaybackService"' "$MANIFEST"
          grep -Fq 'androidx.media3.session.MediaSessionService' "$MANIFEST"
          grep -Fq 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$MANIFEST"
          grep -Fq 'android:mimeType="audio/*"' "$MANIFEST"
          grep -Fq 'android:mimeType="video/*"' "$MANIFEST"

          MAIN_ACTIVITY="app/src/main/java/com/kivora/music/MainActivity.kt"
          test -s "$MAIN_ACTIVITY"
          grep -Fq 'private fun handleIncomingMediaIntent(incoming: Intent?)' "$MAIN_ACTIVITY"
          grep -Fq 'incoming?.action != Intent.ACTION_VIEW' "$MAIN_ACTIVITY"
          grep -Fq 'continueUserPlayback(PendingPlayback("play_video"' "$MAIN_ACTIVITY"
          grep -Fq 'continueUserPlayback(PendingPlayback("play_queue_item"' "$MAIN_ACTIVITY"
          grep -Fq 'Manifest.permission.READ_MEDIA_VIDEO' "$MAIN_ACTIVITY"
          grep -Fq 'videoPermissionLauncher.launch(permission)' "$MAIN_ACTIVITY"
          grep -Fq 'private val videoScanExecutor = Executors.newSingleThreadExecutor()' "$MAIN_ACTIVITY"
          grep -Fq 'videoScanExecutor.execute {' "$MAIN_ACTIVITY"
          grep -Fq 'videoScanExecutor.shutdownNow()' "$MAIN_ACTIVITY"
          grep -Fq 'private val musicScanExecutor = Executors.newSingleThreadExecutor()' "$MAIN_ACTIVITY"
          grep -Fq 'musicScanExecutor.execute {' "$MAIN_ACTIVITY"
          grep -Fq 'musicScanExecutor.shutdownNow()' "$MAIN_ACTIVITY"
          grep -Fq 'requestId != musicScanRequestId' "$MAIN_ACTIVITY"
          grep -Fq 'MediaStore returned no music cursor' "$MAIN_ACTIVITY"
          grep -Fq 'Keep the last good library intact' "$MAIN_ACTIVITY"
          grep -Fq 'error.message?.takeIf { it.isNotBlank() }' "$MAIN_ACTIVITY"
          grep -Fq 'error.javaClass.simpleName.ifBlank { "Unknown error" }' "$MAIN_ACTIVITY"
          grep -Fq 'MediaStore returned no video cursor' "$MAIN_ACTIVITY"
          grep -Fq 'Keep the last good video library intact' "$MAIN_ACTIVITY"
          grep -Fq 'Executors.newFixedThreadPool(2)' "$MAIN_ACTIVITY"
          grep -Fq 'contentResolver.loadThumbnail(thumbnailUri, thumbnailSize, null)' "$MAIN_ACTIVITY"
          grep -Fq 'videoThumbnailExecutor.shutdownNow()' "$MAIN_ACTIVITY"

          if grep -Eiq 'com\.startapp|StartAppSDK|asiafilm\.org/4/d52fd43d84340c6fa7784c326206088f' "$GRADLE_FILE" app/src/main; then
            echo "Unexpected advertising SDK or SmartLink reference found."
            exit 1
          fi
          echo "Media-service, file-opening, app-label, and ad-free checks passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in {1..20}; do
            echo y
          done | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run media file classification unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle testDebugUnitTest

      - name: Restore release signing keystore
        shell: bash
        env:
          A1_KEYSTORE_BASE64: ${{ secrets.A1_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${A1_KEYSTORE_BASE64}" ]]; then
            echo "Missing GitHub Actions secret: A1_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$A1_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a1-family-release.jks"
          test -s "$RUNNER_TEMP/a1-family-release.jks"
          chmod 600 "$RUNNER_TEMP/a1-family-release.jks"
          echo "Release keystore restored to temporary runner storage."

      - name: Build signed release APK and release AAB
        shell: bash
        env:
          A1_KEYSTORE_FILE: ${{ runner.temp }}/a1-family-release.jks
          A1_KEYSTORE_PASSWORD: ${{ secrets.A1_KEYSTORE_PASSWORD }}
          A1_KEY_PASSWORD: ${{ secrets.A1_KEY_PASSWORD }}
          A1_KEY_ALIAS: a1family
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Audit published v1.4.0 APK identity
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_APK="$RUNNER_TEMP/published-v1.4.0.apk"
          BUILT_APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/tapiwanashemanyonga-gif/Media-player/releases/download/v1.4.0/A1FamilyMediaPlayer.apk" \
            --output "$PUBLISHED_APK"
          test -s "$PUBLISHED_APK"
          test -s "$BUILT_APK"

          published_identity="$("$AAPT" dump badging "$PUBLISHED_APK" | sed -n '1p' | sed -n "s/^package: name='\\([^']*\\)' versionCode='\\([^']*\\)' versionName='\\([^']*\\)'.*/\\1|\\2|\\3/p")"
          built_identity="$("$AAPT" dump badging "$BUILT_APK" | sed -n '1p' | sed -n "s/^package: name='\\([^']*\\)' versionCode='\\([^']*\\)' versionName='\\([^']*\\)'.*/\\1|\\2|\\3/p")"

          echo "Published APK identity: $published_identity"
          echo "Newly built APK identity: $built_identity"
          expected_identity="com.a1family.media|5|1.4"
          if [[ "$published_identity" != "$expected_identity" ]]; then
            echo "ERROR: Published APK identity is not the expected A1 Family v1.4 identity ($expected_identity)."
            exit 1
          fi
          if [[ "$built_identity" != "$expected_identity" ]]; then
            echo "ERROR: Newly built APK identity is not the expected A1 Family v1.4 identity ($expected_identity)."
            exit 1
          fi
          if [[ "$published_identity" != "$built_identity" ]]; then
            echo "ERROR: Published and newly built APK identities differ."
            exit 1
          fi

          published_cert="$("$APKSIGNER" verify --verbose --print-certs "$PUBLISHED_APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | sed -n '1p')"
          built_cert="$("$APKSIGNER" verify --verbose --print-certs "$BUILT_APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | sed -n '1p')"
          if [[ -z "$published_cert" || -z "$built_cert" ]]; then
            echo "ERROR: Could not read the signing-certificate fingerprint from both APKs."
            exit 1
          fi
          echo "Published APK certificate SHA-256: $published_cert"
          echo "Newly built APK certificate SHA-256: $built_cert"
          if [[ "$published_cert" != "$built_cert" ]]; then
            echo "ERROR: Published and newly built APK signing certificates differ."
            exit 1
          fi
          echo "Published APK identity and signing certificate match the expected release."


      - name: Verify release AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          echo "Release AAB signature verification passed."

      - name: Upload release APK only
        uses: actions/upload-artifact@v4
        with:
          name: A1-Family-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB separately
        uses: actions/upload-artifact@v4
        with:
          name: A1-Family-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
