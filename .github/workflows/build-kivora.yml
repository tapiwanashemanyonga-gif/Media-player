name: Build A1 Family Media Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - perf/a1-family-all-device-stability
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

# Keep only the newest run for this pull request/branch; stale matrix runs waste emulator capacity.
concurrency:
  group: a1-family-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-compatibility:
    name: Android API ${{ matrix.api-level }} compatibility test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [24, 29, 31, 33, 34, 35, 36]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Launch emulator and run compatibility and playback tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          # Keep the install, SDK check, permission grant and test in one shell invocation.
          script: gradle --no-daemon installDebug && sdk_level=$(adb shell getprop ro.build.version.sdk | tr -d '\r') && if [ "$sdk_level" -ge 33 ]; then adb shell pm grant com.a1family.media android.permission.READ_MEDIA_AUDIO; else adb shell pm grant com.a1family.media android.permission.READ_EXTERNAL_STORAGE; fi && gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14

  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify media safety, performance and Native Banner integration
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="app/src/main/java/com/kivora/music/MainActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          GRADLE_FILE="app/build.gradle.kts"
          COMPATIBILITY_TEST="app/src/androidTest/java/com/kivora/music/MainActivityCompatibilityTest.kt"
          PLAYBACK_TEST="app/src/androidTest/java/com/kivora/music/MainActivityPlaybackTest.kt"
          SONG_AD_FILE="app/src/main/java/com/kivora/music/AdsterraSongListBanner.kt"
          HOME_AD_FILE="app/src/main/java/com/kivora/music/AdsterraHomeNativeBanner.kt"
          test -s "$MAIN_ACTIVITY"
          test -s "$MANIFEST"
          test -s "$COMPATIBILITY_TEST"
          test -s "$PLAYBACK_TEST"
          test -s "$SONG_AD_FILE"
          test -s "$HOME_AD_FILE"
          git fetch --no-tags --depth=1 origin main
          git diff --check FETCH_HEAD HEAD
          grep -Fq 'private var songRenderLimit = 40' "$MAIN_ACTIVITY"
          grep -Fq 'private var videoRenderLimit = 24' "$MAIN_ACTIVITY"
          grep -Fq 'handler.postDelayed(pendingRender, 180L)' "$MAIN_ACTIVITY"
          grep -Fq 'searchRenderRunnable?.let(handler::removeCallbacks)' "$MAIN_ACTIVITY"
          grep -Fq 'cachedAlbumGroups' "$MAIN_ACTIVITY"
          HELPER_FILE="app/src/main/java/com/kivora/music/MediaLibraryHelpers.kt"
          UNIT_TEST_FILE="app/src/test/java/com/kivora/music/MediaLibraryHelpersTest.kt"
          test -s "$HELPER_FILE"
          test -s "$UNIT_TEST_FILE"
          grep -Fq 'firstItemByKey(songs)' "$MAIN_ACTIVITY"
          grep -Fq 'filterItemsByTitle(deviceVideos, query)' "$MAIN_ACTIVITY"
          grep -Fq 'firstItemByKeyPreservesFirstDuplicate' "$UNIT_TEST_FILE"
          grep -Fq 'titleFilterTrimsAndIgnoresCase' "$UNIT_TEST_FILE"
          grep -Fq 'else if (tab == "videos" && deviceVideos.isNotEmpty())' "$MAIN_ACTIVITY"
          grep -Fq 'minimumHeight = dp(if (compactPlayerLayout) 34 else 42)' "$MAIN_ACTIVITY"
          grep -Fq 'musicScanExecutor.execute {' "$MAIN_ACTIVITY"
          grep -Fq 'videoScanExecutor.execute {' "$MAIN_ACTIVITY"
          grep -Fq 'videoThumbnailCache' "$MAIN_ACTIVITY"
          grep -Fq 'videoThumbnailExecutor.execute {' "$MAIN_ACTIVITY"
          grep -Fq 'songRenderLimit' "$MAIN_ACTIVITY"
          grep -Fq 'videoRenderLimit' "$MAIN_ACTIVITY"
          grep -Fq 'MediaStore returned no music cursor' "$MAIN_ACTIVITY"
          grep -Fq 'Your existing library was kept' "$MAIN_ACTIVITY"
          grep -Fq 'handleIncomingMediaIntent' "$MAIN_ACTIVITY"
          grep -Fq 'android:mimeType="audio/*"' "$MANIFEST"
          grep -Fq 'android:mimeType="video/*"' "$MANIFEST"
          grep -Fq 'android:name=".KivoraPlaybackService"' "$MANIFEST"
          grep -Fq 'https://bancadeltempoidea.org/22/ff28c7116d6569c8812a7c433e1a3c3f' "$SONG_AD_FILE"
          grep -Fq "'height': 50" "$SONG_AD_FILE"
          grep -Fq 'visibleSongs.size > 50 && songIndex == 3' "$MAIN_ACTIVITY"
          grep -Fq 'AdsterraSongListBanner.create(this)' "$MAIN_ACTIVITY"
          grep -Fq 'https://bancadeltempoidea.org/21/0304c09311629f5e78df4f92df9e242b' "$HOME_AD_FILE"
          grep -Fq 'container-0304c09311629f5e78df4f92df9e242b' "$HOME_AD_FILE"
          grep -Fq 'AdsterraHomeNativeBanner.create(this)' "$MAIN_ACTIVITY"
          if grep -Eiq 'com\\.startapp|StartAppSDK|asiafilm\\.org/4/' "$GRADLE_FILE" app/src/main; then
            echo "Unexpected legacy advertising SDK or Smartlink found."
            exit 1
          fi
          echo "Media performance, file handling and both Adsterra banner placements passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in {1..20}; do echo y; done | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run media library unit regression tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Restore existing A1 release signing keystore
        shell: bash
        env:
          A1_KEYSTORE_BASE64: ${{ secrets.A1_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${A1_KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing existing GitHub Actions secret: A1_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$A1_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a1-family-release.jks"
          test -s "$RUNNER_TEMP/a1-family-release.jks"
          chmod 600 "$RUNNER_TEMP/a1-family-release.jks"
          echo "A1_KEYSTORE_FILE=$RUNNER_TEMP/a1-family-release.jks" >> "$GITHUB_ENV"

      - name: Build signed production release APK
        shell: bash
        env:
          A1_KEYSTORE_FILE: ${{ runner.temp }}/a1-family-release.jks
          A1_KEYSTORE_PASSWORD: ${{ secrets.A1_KEYSTORE_PASSWORD }}
          A1_KEY_PASSWORD: ${{ secrets.A1_KEY_PASSWORD }}
          A1_KEY_ALIAS: a1family
          A1_MEDIA_APP_KEY: ${{ secrets[format('A1_{0}', 'MEDIA_APP_KEY')] }}
        run: |
          set -euo pipefail
          for name in A1_KEYSTORE_PASSWORD A1_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing existing GitHub Actions secret: $name"
              exit 1
            fi
          done
          gradle --no-daemon --stacktrace --warning-mode all assembleRelease

      - name: Verify production package and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: A1-Family-Media-1.8-hotfix
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub release for the website
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: A1 FAMILY MEDIA ${{ github.ref_name }}
          body: |
            A1 FAMILY MEDIA release ${{ github.ref_name }}.

            See the verified app version and release notes in this workflow run.
          files: app/build/outputs/apk/release/app-release.apk
          overwrite_files: false
          make_latest: true
