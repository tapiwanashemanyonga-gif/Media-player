name: Build Kivora Music Player

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - safety/a1-family-stage-1
      - feature/a1-family-media-upgrade
      - feature/ui-video-space-polish
      - fix/open-audio-from-files
      - ui/remove-duplicate-search-tab
      - feature/ad-free-library-polish

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in {1..20}; do
            echo y
          done | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore release signing keystore
        shell: bash
        env:
          A1_KEYSTORE_BASE64: ${{ secrets.A1_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${A1_KEYSTORE_BASE64}" ]]; then
            echo "Missing GitHub Actions secret: A1_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$A1_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a1-family-release.jks"
          test -s "$RUNNER_TEMP/a1-family-release.jks"
          chmod 600 "$RUNNER_TEMP/a1-family-release.jks"
          echo "Release keystore restored to temporary runner storage."

      - name: Build signed release APK and release AAB
        shell: bash
        env:
          A1_KEYSTORE_FILE: ${{ runner.temp }}/a1-family-release.jks
          A1_KEYSTORE_PASSWORD: ${{ secrets.A1_KEYSTORE_PASSWORD }}
          A1_KEY_PASSWORD: ${{ secrets.A1_KEY_PASSWORD }}
          A1_KEY_ALIAS: a1family
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Verify release AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          echo "Release AAB signature verification passed."

      - name: Upload release APK only
        uses: actions/upload-artifact@v4
        with:
          name: A1-Family-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB separately
        uses: actions/upload-artifact@v4
        with:
          name: A1-Family-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
