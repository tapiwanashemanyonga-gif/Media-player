
name: Build Kivora Music Player

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/a1-adsterra-webview-song-list

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in {1..20}; do
            echo y
          done | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android and Gradle toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK 36 and Build Tools 36.0.0 are installed."

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kivora-Music-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
