name: Build A1 Family Media Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in {1..20}; do echo y; done | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure persistent release signing
        shell: bash
        env:
          A1_RELEASE_KEYSTORE_BASE64: ${{ secrets.A1_RELEASE_KEYSTORE_BASE64 }}
          A1_RELEASE_STORE_PASSWORD: ${{ secrets.A1_RELEASE_STORE_PASSWORD }}
          A1_RELEASE_KEY_ALIAS: ${{ secrets.A1_RELEASE_KEY_ALIAS }}
          A1_RELEASE_KEY_PASSWORD: ${{ secrets.A1_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in A1_RELEASE_KEYSTORE_BASE64 A1_RELEASE_STORE_PASSWORD A1_RELEASE_KEY_ALIAS A1_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$A1_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a1-release.jks"
          echo "A1_RELEASE_STORE_FILE=$RUNNER_TEMP/a1-release.jks" >> "$GITHUB_ENV"
          echo "A1_RELEASE_STORE_PASSWORD=$A1_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "A1_RELEASE_KEY_ALIAS=$A1_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "A1_RELEASE_KEY_PASSWORD=$A1_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify release package identity
        shell: bash
        run: |
          grep -q 'applicationId = "com.a1family.media"' app/build.gradle.kts
          echo "Confirmed package ID: com.a1family.media"

      - name: Build signed release APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: A1-Family-Media-1.5-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
