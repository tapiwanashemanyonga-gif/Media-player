name: Improvement suggestion
description: Suggest a way to improve an existing A1 FAMILY MEDIA feature.
title: "[IMPROVEMENT] "
labels: ["improvement"]
body:
  - type: textarea
    id: improvement
    attributes:
      label: What should be improved?
      description: Tell us what could work or look better.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: How would this improve the app?
    validations:
      required: false
